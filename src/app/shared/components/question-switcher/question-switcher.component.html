@for(answer of answers(); track $index; let idx = $index){
    <button [matButton]="idx === currentQuestionIndex() ? 'filled' : 'outlined'" class="answer-item"
        (click)="setQuestionIndex.emit(idx)">
        @if(answer.isCorrect){
        ✅
        } @else if(answer.isCorrect === false){
        ❌
        }
    </button>
}
