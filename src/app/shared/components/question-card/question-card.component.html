@if (question(); as question) {
    <section class="question">
        <div class="question-text">{{ question.question }}</div>

        @if (question.image) {
            <img class="image" [src]="`./assets/images/${question.category}/${question.id}.jpg`"
                alt="Ілюстрація до питання" />
        }
        <div class="options">
            @for (option of options(); track option.number) {
                <app-answer-option [option]="option" [correctNumber]="question.answer" [answer]="answer()"
                    [reveal]="reveal()" [readonly]="readonly()" (choose)="setAnswer.emit($event)" />
            }
        </div>
    </section>
}
