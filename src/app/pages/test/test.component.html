<app-timer [minutes]="1" (timeEnd)="onTimeEnd()" />

<app-question-switcher [answers]="answers()" [currentQuestionIndex]="currentQuestionIndex()"
    (setQuestionIndex)="setQuestionIndex($event)" />

<section class="question">
    <div class="question-text">{{ currentQuestion()?.question }}</div>

    @if(currentQuestion()?.image){
    <img class="image" [src]="`./assets/images/${currentQuestion()?.category}/${currentQuestion()?.id}.jpg`"
        alt="Question Image" />
    }
    <div class="options">
        @for(option of options(); track option.key){
        <button [matButton]="currentAnswer().answerIndex === option.key ? 'filled' : 'outlined'"
            [disabled]="!!currentAnswer().answerIndex" class="option-button" (click)="setAnswer(option.key)">
            {{ option.value }}
        </button>
        }
    </div>

</section>
