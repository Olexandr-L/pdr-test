<section class="answer-list">
    @for(answer of answers(); track answer; let idx = $index){
    <button matButton="outlined" class="answer-item" (click)="setQuestionIndex(idx)">
        @if(answer.isCorrect){
            ✅
        } @else if(answer.isCorrect === false){
            ❌
        }
    </button>
    }
</section>

<section class="question">
    <div class="question-text">{{ currentQuestion()?.question }}</div>

    @if(currentQuestion()?.image){
        <img class="image" [src]="`./assets/images/${currentQuestion()?.category}/${currentQuestion()?.id}.jpg`"
            alt="Question Image" />
    }
    <div class="options">
        @for(option of options(); track option.key){
        <button matButton="outlined" class="option-button" (click)="setAnswer(option.key)">
            {{ option.value }}
        </button>
        }
    </div>

</section>
